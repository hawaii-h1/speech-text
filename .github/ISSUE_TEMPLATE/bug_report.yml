name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Shift+Q
        2. Say "..."
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options: ["Inline recording", "AI recording", "Record Window", "Edit Selection with AI", "Settings / other"]
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Speech engine
      options: ["Apple (on-device)", "Groq", "ElevenLabs", "OpenAI", "Local model (Parakeet / Whisper)", "Not sure"]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "Menu bar icon → Debug Log. Remove anything private before pasting — it can contain transcribed text."
      render: text
