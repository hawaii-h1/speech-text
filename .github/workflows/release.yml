name: Release

# A pushed tag `vX.Y.Z` builds, signs and notarizes SpeechText and opens a *draft*
# GitHub release with the disk image — publishing it stays a human decision.
#
# A pull request that touches the packaging runs the same script unsigned, so a
# broken release pipeline is found in review rather than on release day.
#
# It runs on the organisation's self-hosted Mac, like CI. That machine is someone's
# own Mac, not a throwaway VM, so the job leaves nothing behind: no sudo, the
# signing keychain taken back out of the user's search list, and the notary key
# deleted — whether the job succeeds, fails or is cancelled. A pull request never
# sees a secret at all (every secret below is gated on the event), and the
# repository must stay private: a public one must not run pull requests here.
#
# Secrets (docs/releasing.md explains where each comes from):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   the signing certificate
#   and either an App Store Connect API key —
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID (issuer empty for an individual key)
#   or an Apple ID —
#   NOTARY_APPLE_ID, NOTARY_APP_PASSWORD, NOTARY_TEAM_ID
#   SPARKLE_ED_PRIVATE_KEY                               the update-signing key

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - scripts/package-release.sh
      - scripts/make-appcast.sh
      - .github/workflows/release.yml
      - SpeechText/SpeechText/SpeechText.entitlements
      - SpeechText/SpeechText.xcodeproj/project.pbxproj
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0

      # Hosted images carry several Xcodes; the self-hosted Mac uses the one it has,
      # and must not be asked for a sudo password.
      - name: Select the newest Xcode
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: The tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          project=$(sed -n 's/.*MARKETING_VERSION = \([0-9][0-9.]*\);.*/\1/p' SpeechText/SpeechText.xcodeproj/project.pbxproj | head -1)
          if [ "v$project" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $project. Cut releases with /rebuild --tag."
            exit 1
          fi

      - name: Import the Developer ID certificate
        id: signing
        # Pull requests never sign: a branch must not be able to produce an image that
        # looks like a release.
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "No signing certificate in the repository secrets."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # The search list as it was, so the cleanup puts back exactly this.
          security list-keychains -d user | tr -d '"' > "$RUNNER_TEMP/keychains-before"
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains-before")
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate imported, but it is not a Developer ID Application identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: A tag is only released signed
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.identity == ''
        run: |
          echo "::error::No Developer ID certificate is configured, so this tag cannot become a release. See docs/releasing.md."
          exit 1

      - name: Package
        env:
          SPT_DEVELOPER_ID: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_P8_BASE64 || '' }}
          SPT_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_ID || '' }}
          SPT_NOTARY_ISSUER: ${{ github.event_name != 'pull_request' && secrets.NOTARY_ISSUER_ID || '' }}
          SPT_NOTARY_APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_APPLE_ID || '' }}
          SPT_NOTARY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOTARY_APP_PASSWORD || '' }}
          SPT_NOTARY_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export SPT_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          scripts/package-release.sh --out "$RUNNER_TEMP/release"

      - name: Keep the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeechText-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: The release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, written by hand as the work happened —
          # not a list of commit subjects. The GitHub release and the update window
          # inside the app show the same text.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Write the appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPT_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPT_SPARKLE_KEY" ]; then
            echo "::error::No SPARKLE_ED_PRIVATE_KEY secret, so this release could not be offered as an update. See docs/releasing.md."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          scripts/make-appcast.sh \
            --dmg "$RUNNER_TEMP/release/SpeechText-$version.dmg" \
            --tag "$GITHUB_REF_NAME" \
            --notes "$RUNNER_TEMP/notes.md" \
            --out "$RUNNER_TEMP/release"

      - name: Open a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # appcast.xml is what installed copies of the app read: publishing the draft is
          # what makes this version the answer at .../releases/latest/download/appcast.xml.
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/SpeechText-$version.dmg" \
            "$RUNNER_TEMP/release/SpeechText-$version.dmg.sha256" \
            "$RUNNER_TEMP/release/appcast.xml" \
            --draft --verify-tag \
            --title "SpeechText $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before")
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
